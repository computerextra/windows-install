name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Restore
        run: dotnet restore WindowsInstall.slnx

      - name: Build
        run: dotnet build WindowsInstall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WindowsInstall.slnx --configuration Release --no-build