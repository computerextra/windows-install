name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Restore
        run: dotnet restore WindowsInstall.slnx

      - name: Build
        run: dotnet build WindowsInstall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WindowsInstall.slnx --configuration Release --no-build

      - name: Bootstrap environment and smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'WindowsInstallBootstrapFixture'
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null

          $fixtureAsset = Join-Path $fixtureDirectory 'fixture.exe'
          $fixtureChecksum = Join-Path $fixtureDirectory 'fixture.exe.sha256'
          [System.IO.File]::WriteAllText($fixtureAsset, 'bootstrap-smoke-test')
          $hash = (Get-FileHash -LiteralPath $fixtureAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($fixtureChecksum, "$hash  fixture.exe`n")

          $assetUri = [Uri]$fixtureAsset
          $checksumUri = [Uri]$fixtureChecksum

          function global:Get-CimInstance {
            param(
              [Parameter(Mandatory)]
              [string]$ClassName
            )

            switch ($ClassName) {
              'Win32_OperatingSystem' {
                return $global:WindowsInstallTestOperatingSystem
              }
              'Win32_Processor' {
                return $global:WindowsInstallTestProcessors
              }
              default {
                throw "Unerwartete CIM-Klasse im Bootstrap-Test: $ClassName"
              }
            }
          }

          function Assert-BootstrapEnvironmentFails {
            param(
              [Parameter(Mandatory)]
              [string]$Version,

              [Parameter(Mandatory)]
              [uint32]$ProductType,

              [Parameter(Mandatory)]
              [uint16]$Architecture,

              [Parameter(Mandatory)]
              [string]$ExpectedMessage
            )

            $global:WindowsInstallTestOperatingSystem = [PSCustomObject]@{
              Version = $Version
              ProductType = $ProductType
            }
            $global:WindowsInstallTestProcessors = @(
              [PSCustomObject]@{
                Architecture = $Architecture
              }
            )

            try {
              & .\bootstrap.ps1 `
                -AssetUri $assetUri `
                -ChecksumUri $checksumUri `
                -NoLaunch

              throw 'Bootstrap hat eine nicht unterstützte Umgebung akzeptiert.'
            }
            catch {
              if ($_.Exception.Message -notlike "*$ExpectedMessage*") {
                throw
              }
            }
          }

          function Remove-BootstrapRuntimeDirectories {
            Get-ChildItem `
              -LiteralPath ([System.IO.Path]::GetTempPath()) `
              -Directory `
              -Filter 'ComputerExtra.WindowsInstall.*' |
                Remove-Item -Recurse -Force
          }

          Remove-BootstrapRuntimeDirectories

          Assert-BootstrapEnvironmentFails `
            -Version '10.0.19045.0' `
            -ProductType 1 `
            -Architecture 9 `
            -ExpectedMessage 'Windows 11 Client'
          Remove-BootstrapRuntimeDirectories

          Assert-BootstrapEnvironmentFails `
            -Version '10.0.26100.0' `
            -ProductType 3 `
            -Architecture 9 `
            -ExpectedMessage 'Windows 11 Client'
          Remove-BootstrapRuntimeDirectories

          Assert-BootstrapEnvironmentFails `
            -Version '10.0.26100.0' `
            -ProductType 1 `
            -Architecture 12 `
            -ExpectedMessage 'Windows 11 x64'
          Remove-BootstrapRuntimeDirectories

          $global:WindowsInstallTestOperatingSystem = [PSCustomObject]@{
            Version = '10.0.26100.0'
            ProductType = 1
          }
          $global:WindowsInstallTestProcessors = @(
            [PSCustomObject]@{
              Architecture = 9
            }
          )

          $badChecksum = Join-Path $fixtureDirectory 'fixture-bad.exe.sha256'
          [System.IO.File]::WriteAllText(
            $badChecksum,
            "$(('0' * 64))  fixture.exe`n")

          try {
            & .\bootstrap.ps1 `
              -AssetUri $assetUri `
              -ChecksumUri ([Uri]$badChecksum) `
              -NoLaunch

            throw 'Bootstrap hat eine ungültige Prüfsumme akzeptiert.'
          }
          catch {
            if (
              $_.Exception.Message -notlike
              '*SHA-256-Prüfung des WindowsInstall-Artefakts fehlgeschlagen*'
            ) {
              throw
            }
          }

          $failedRuntimeDirectories = @(
            Get-ChildItem `
              -LiteralPath ([System.IO.Path]::GetTempPath()) `
              -Directory `
              -Filter 'ComputerExtra.WindowsInstall.*'
          )

          if ($failedRuntimeDirectories.Count -ne 1) {
            throw 'Fehlerhafter Bootstrap-Lauf hat nicht genau ein Diagnoseverzeichnis hinterlassen.'
          }

          $failedLogPath = Join-Path `
            $failedRuntimeDirectories[0].FullName `
            'WindowsInstall.log'

          if (-not (Test-Path -LiteralPath $failedLogPath)) {
            throw 'Fehlerhafter Bootstrap-Lauf hat kein Fehlerlog hinterlassen.'
          }

          $failedLog = [System.IO.File]::ReadAllText($failedLogPath)

          if (
            $failedLog -notmatch '\[ERROR\]' -or
            $failedLog -notlike
              '*SHA-256-Prüfung des WindowsInstall-Artefakts fehlgeschlagen*'
          ) {
            throw 'Fehlerlog enthält nicht die erwarteten Diagnoseinformationen.'
          }

          Remove-BootstrapRuntimeDirectories

          & .\bootstrap.ps1 `
            -AssetUri $assetUri `
            -ChecksumUri $checksumUri `
            -NoLaunch

          $successfulRuntimeDirectories = @(
            Get-ChildItem `
              -LiteralPath ([System.IO.Path]::GetTempPath()) `
              -Directory `
              -Filter 'ComputerExtra.WindowsInstall.*'
          )

          if ($successfulRuntimeDirectories.Count -ne 0) {
            throw 'Erfolgreicher Bootstrap-Lauf hat temporäre Runtime-Verzeichnisse hinterlassen.'
          }
