name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Restore
        run: dotnet restore WindowsInstall.slnx

      - name: Build
        run: dotnet build WindowsInstall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test WindowsInstall.slnx --configuration Release --no-build

      - name: Bootstrap smoke test
        shell: powershell
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'WindowsInstallBootstrapFixture'
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null

          $fixtureAsset = Join-Path $fixtureDirectory 'fixture.exe'
          $fixtureChecksum = Join-Path $fixtureDirectory 'fixture.exe.sha256'
          [System.IO.File]::WriteAllText($fixtureAsset, 'bootstrap-smoke-test')
          $hash = (Get-FileHash -LiteralPath $fixtureAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($fixtureChecksum, "$hash  fixture.exe`n")

          $assetUri = [Uri]$fixtureAsset
          $checksumUri = [Uri]$fixtureChecksum

          & .\bootstrap.ps1 -AssetUri $assetUri -ChecksumUri $checksumUri -NoLaunch

      - name: Restore publish runtime
        run: dotnet restore src/WindowsInstall.App/WindowsInstall.App.csproj --runtime win-x64

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD 'artifacts\win-x64'
          $assetPath = Join-Path $PWD 'artifacts\WindowsInstall-win-x64.exe'

          dotnet publish `
            src/WindowsInstall.App/WindowsInstall.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output $publishDirectory

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $publishedExecutable = Join-Path $publishDirectory 'WindowsInstall.App.exe'

          if (-not (Test-Path -LiteralPath $publishedExecutable)) {
              throw 'Erwartetes Publish-Artefakt WindowsInstall.App.exe fehlt.'
          }

          Move-Item -LiteralPath $publishedExecutable -Destination $assetPath

          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
              "$assetPath.sha256",
              "$hash  WindowsInstall-win-x64.exe`n",
              [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/WindowsInstall-win-x64.exe" `
            "artifacts/WindowsInstall-win-x64.exe.sha256" `
            --verify-tag `
            --generate-notes
